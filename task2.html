<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
</head>
<style>
    body{
        background:lightblue;
    }
    .child1{
        background-color:orange;
        height: 100px;
        width:100px;
        border-radius:50%;
        position: relative;
        left:500px;
        top: 300px;
        z-index: 2;
    }
    .child2{
        background-color: yellow;
        height: 100px;
        width: 100px;
        border-radius: 50%;
        z-index: 1;
        position: absolute;
        top:308px;
        left: 509px;
        animation:eclipse 4s infinite ease-in;
    }
    @keyframes eclipse {
        0%{
            top: 299px;
            left:499px;
            height:120px;
            width: 120px;
        }
        25%{
            top:308px;
            left:509px;
        }
        50%{
            top: 299px;
            left:499px;
            height:120px;
            width: 120px;
        }
    }
</style>
<body>
        <div class="child1"></div>
        <div class="child2"></div>
</body>
</html>
