    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>
        .parent{
            display: grid;
            grid-template-columns: repeat(3,300px);
            height:500px;
            grid-template-rows: repeat(2,300px);
            gap:10px;
        }
        .child1{
        background-color:red ;
        grid-column-start: 1;
        grid-column-end: 3;
    }
    .child2{
        background-color: orange ;
        grid-column-start: 3;
        grid-column-end: 4;
        grid-row-start: 1;
        grid-row-end: 3;
    }
    .child3{
        background-color:lightseagreen;
    }
    .child4{
        background-color:green;
    }
@media screen and (min-width:320px) and (max-width:426px){
    .parent{
        display: grid;
        grid-template-columns:300px;
        grid-template-rows: repeat(4,1fr);
        height: 500px;
        row-gap: 10px;
        column-gap: 20px;
    }
    .child1{
        background-color:red ;
        grid-row: 1/2;
        grid-column: 1/2;
    }
    .child2{
        background-color: darksalmon ;
        grid-row: 2/3;
        grid-column: 1/2;
    }
    .child3{
        background-color:orange;
        grid-row: 3/4;
    }
    .child4{
        background-color:green;
        grid-row: 4/5;
    }
}
@media screen and (min-width:425px) and (max-width:769px){
    .parent{
        display: grid;
        grid-template-columns:300px;
        grid-template-rows: repeat(2,1fr);
        height: 500px;
        row-gap: 10px;
        column-gap: 20px;
    }
    .child1{
        background-color:red ;
        grid-row: 1/2;
        grid-column: 1/2;
    }
    .child2{
        background-color: darksalmon ;
        grid-row: 1/2;
        grid-column: 2/3;
    }
    .child3{
        background-color:orange;
        grid-row: 2/3;
        grid-column: 1/2;
    }
    .child4{
        background-color:green;
        grid-row: 2/3;
        grid-column: 2/3;
    }
}
    </style>
    </head>
    <body>
        <h1><a href="./gridtask.html">Home Page</a></h1>
        <div class="parent">
        <div class="child1">child1</div>
        <div class="child2">child2</div>
        <div class="child3">child3</div>
        <div class="child4">child4</div>
    </div>
    </body>
    </html>
</body>
</html>
