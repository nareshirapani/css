<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .parent{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        height: 400px;
        row-gap: 10px;
        column-gap: 20px;
    }
    .child1{
        background-color:red ;
    }
    .child2{
        background-color: darksalmon ;
    }
    .child3{
        background-color:orange;
    }
    .child4{
        background-color:green;
    }
    .child5{
        background-color:lightseagreen ;
    }
    .child6{
        background-color:lightgreen;
    }
@media screen and (min-width:320px) and (max-width:426px){
    parent{
        display: grid;
        grid-template-columns: 300px;
        grid-template-rows: repeat(6,1fr);
        height: 500px;
        row-gap: 10px;
        column-gap: 20px;
    }
    .child1{
        background-color:red ;
        grid-row: 1/2;
    }
    .child2{
        background-color: darksalmon ;
        grid-row: 2/3;
    }
    .child3{
        background-color:orange;
        grid-row: 3/4;
    }
    .child4{
        background-color:green;
        grid-row: 4/5;
    }
    .child5{
        background-color:lightseagreen ;
        grid-row: 5/6;
    }
    .child6{
        background-color:lightgreen;
        grid-row: 6/7;
    }
}
@media screen and (min-width:425px) and (max-width:769px){
    .parent{
        display: grid;
        grid-template-columns: repeat(2,1fr);
        height: 400px;
        row-gap: 10px;
        column-gap: 20px;
    }
    .child1{
        background-color:red ;
        grid-row: 1/2;
        grid-column: 1/2;
    }
    .child2{
        background-color: darksalmon ;
        grid-row: 1/2;
        grid-column: 2/3;
    }
    .child3{
        background-color:orange;
        grid-row: 2/3;
        grid-column: 1/2;
    }
    .child4{
        background-color:green;
        grid-row: 2/3;
        grid-column: 2/3;
    }
    .child5{
        background-color:lightseagreen ;
        grid-row: 3/4;
        grid-column: 1/2;
    }
    .child6{
        background-color:lightgreen;
        grid-row: 3/4;
        grid-column: 2/3;
    }
}
</style>
</head>
<body>
    <h1><a href="./gridtask.html">Home Page</a></h1>
    <div class="parent">
        <div class="child1">child1</div>
        <div class="child2">child2</div>
        <div class="child3">child3</div>
        <div class="child4">child4</div>
        <div class="child5">child5</div>
        <div class="child6">child6</div>
    </div>
</body>
</html>
